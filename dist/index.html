<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
    <title>Schülerplaner</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overscroll-behavior-y: none;
      }
      #root {
        min-height: 100%;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      /* --- Interaction feedback (buttons, taps, inputs) --- */
      button, [data-tap] {
        transition: transform 0.12s ease, opacity 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      button:active:not(:disabled), [data-tap]:active {
        transform: scale(0.94);
        opacity: 0.85;
      }
      input, select, textarea {
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus, select:focus, textarea:focus {
        outline: 2px solid rgba(150, 150, 150, 0.55);
        outline-offset: 1px;
      }

      /* --- Entrance animations --- */
      @keyframes fpFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fpSlideUp {
        from { transform: translateY(28px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes fpScaleIn {
        from { transform: scale(0.94); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes fpPopIn {
        0% { transform: scale(0.5); opacity: 0; }
        65% { transform: scale(1.12); opacity: 1; }
        100% { transform: scale(1); }
      }
      @keyframes fpToastIn {
        from { transform: translate(-50%, 10px); opacity: 0; }
        to { transform: translate(-50%, 0); opacity: 1; }
      }
      .fp-fade { animation: fpFadeIn 0.18s ease both; }
      .fp-sheet { animation: fpSlideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fp-dialog { animation: fpScaleIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fp-pop { animation: fpPopIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .fp-toast { animation: fpToastIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fp-expand {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.22s ease;
      }
      .fp-expand.fp-expand-open {
        grid-template-rows: 1fr;
      }
      .fp-expand > div {
        overflow: hidden;
        min-height: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      html[data-animations="off"] *, html[data-animations="off"] *::before, html[data-animations="off"] *::after {
        animation: none !important;
        transition: none !important;
      }
    </style>
